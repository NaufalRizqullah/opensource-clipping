<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Detail — OSC Studio</title>
    <meta name="description" content="View job progress and results — OpenSource Clipping Studio">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'], display: ['Outfit', 'sans-serif'] },
                    colors: {
                        brand: { 50: '#f5f3ff', 100: '#ede9fe', 200: '#ddd6fe', 400: '#a78bfa', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca', 900: '#312e81' }
                    }
                }
            }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="studio.css">
    <script>if (localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark');</script>
</head>

<body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 font-sans transition-colors duration-300">

    <div id="mobile-overlay" class="mobile-overlay hidden" onclick="closeSidebar()"></div>

    <div class="studio-layout">
        <!-- Sidebar -->
        <aside id="sidebar" class="studio-sidebar">
            <div class="sidebar-brand">
                <a href="../index.html" class="flex items-center gap-2 group mb-2">
                    <div class="p-1.5 rounded-lg bg-brand-600 text-white group-hover:scale-105 transition-transform shadow-md shadow-brand-500/20">
                        <i data-lucide="scissors" class="w-4 h-4"></i>
                    </div>
                    <span class="font-display font-bold text-sm bg-gradient-to-r from-brand-600 to-indigo-500 dark:from-brand-400 dark:to-sky-400 bg-clip-text text-transparent">
                        Opensource Clipping
                    </span>
                </a>
                <h2 class="font-display font-bold text-lg text-slate-900 dark:text-white">🎬 Studio</h2>
                <p class="text-xs text-slate-400 dark:text-slate-500">AI Auto-Clipper · Remote GPU</p>
            </div>
            <nav class="sidebar-nav">
                <a href="index.html" class="sidebar-link"><i data-lucide="layout-dashboard" class="nav-icon"></i> Dashboard</a>
                <a href="new-job.html" class="sidebar-link"><i data-lucide="plus-circle" class="nav-icon"></i> New Job</a>
                <a href="settings.html" class="sidebar-link"><i data-lucide="settings" class="nav-icon"></i> Settings</a>
            </nav>
            <div class="connect-panel">
                <div class="flex items-center gap-2 mb-2">
                    <span id="connect-dot" class="connect-dot offline"></span>
                    <span id="connect-label" class="text-xs text-slate-500 dark:text-slate-400 truncate flex-1">Not connected</span>
                </div>
                <div class="flex gap-2 w-full">
                    <button id="connect-btn" onclick="showConnectModal()" class="flex-1 text-xs font-medium px-3 py-2 rounded-lg border border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors text-slate-600 dark:text-slate-300">
                        Connect
                    </button>
                    <button id="sidebar-stop-btn" onclick="stopBackendServer()" class="hidden w-10 flex items-center justify-center text-xs font-medium rounded-lg border border-red-500 bg-red-600 hover:bg-red-700 text-white transition-colors" title="Stop Kaggle Server">
                        <i data-lucide="power" class="w-3.5 h-3.5"></i>
                    </button>
                </div>
                <button onclick="toggleTheme()" class="w-full mt-2 text-xs font-medium px-3 py-2 rounded-lg border border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors text-slate-600 dark:text-slate-300 flex items-center justify-center gap-2">
                    <span class="dark:hidden"><i data-lucide="moon" class="w-3.5 h-3.5"></i></span>
                    <span class="hidden dark:inline"><i data-lucide="sun" class="w-3.5 h-3.5"></i></span>
                    <span class="dark:hidden">Dark Mode</span><span class="hidden dark:inline">Light Mode</span>
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="studio-main">
            <div class="md:hidden sticky top-0 z-30 flex items-center gap-3 px-4 h-14 bg-white/80 dark:bg-slate-950/80 backdrop-blur-md border-b border-slate-200/80 dark:border-slate-800/80">
                <button onclick="toggleSidebar()" class="mobile-toggle p-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800"><i data-lucide="menu" class="w-5 h-5"></i></button>
                <span class="font-display font-bold text-sm">🎬 Job Detail</span>
            </div>

            <div class="max-w-4xl mx-auto px-4 sm:px-6 py-8 fade-in">

                <!-- Loading State -->
                <div id="page-loading" class="text-center py-20">
                    <div class="spinner spinner-dark mx-auto mb-3"></div>
                    <p class="text-sm text-slate-400">Loading job...</p>
                </div>

                <!-- Not Found -->
                <div id="page-not-found" class="hidden text-center py-20">
                    <div class="text-5xl mb-4">🔍</div>
                    <h3 class="font-display font-semibold text-lg text-slate-900 dark:text-white mb-2">Job not found</h3>
                    <a href="index.html" class="text-sm text-brand-600 dark:text-brand-400 hover:underline">← Back to Dashboard</a>
                </div>

                <!-- Job Content -->
                <div id="page-content" class="hidden">

                    <!-- Header -->
                    <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 mb-8">
                        <div>
                            <h1 class="font-display font-bold text-2xl text-slate-900 dark:text-white flex items-center gap-3">
                                Job <span id="job-id" class="text-brand-500 font-mono text-lg"></span>
                            </h1>
                            <p id="job-source" class="text-slate-500 dark:text-slate-400 text-sm mt-1 truncate max-w-md"></p>
                        </div>
                        <div class="flex items-center gap-2">
                            <span id="job-badge" class="badge"></span>
                            <button id="cancel-job-btn" onclick="cancelJob()" class="hidden px-3 py-2 rounded-lg text-xs font-medium border border-red-300 text-red-500 disabled:opacity-50">Cancel Job</button>
                            <a href="index.html" class="px-3 py-2 rounded-lg text-xs font-medium border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors flex items-center gap-1">
                                <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i> Back
                            </a>
                        </div>
                    </div>

                    <!-- Progress Section -->
                    <div id="progress-section" class="hidden glass-card p-6 rounded-2xl border border-slate-200/80 dark:border-slate-800/80 shadow-sm mb-6">
                        <div class="flex justify-between items-center mb-3">
                            <span class="text-sm font-semibold text-slate-900 dark:text-white">Progress</span>
                            <span id="progress-percent" class="text-sm font-semibold text-brand-600 dark:text-brand-400">0%</span>
                        </div>
                        <div class="progress-bar-bg">
                            <div id="progress-bar" class="progress-bar-fill" style="width: 0%"></div>
                        </div>
                        <p id="progress-message" class="text-xs text-slate-500 dark:text-slate-400 mt-3"></p>
                        <div id="progress-steps" class="progress-steps mt-4"></div>
                    </div>

                    <!-- Error Section -->
                    <div id="error-section" class="hidden glass-card p-5 rounded-2xl border border-red-200 dark:border-red-900/40 shadow-sm mb-6">
                        <h3 class="text-sm font-semibold text-red-500 mb-2 flex items-center gap-2">
                            <i data-lucide="alert-circle" class="w-4 h-4"></i> Error
                        </h3>
                        <p id="error-message" class="text-xs text-slate-600 dark:text-slate-300"></p>
                    </div>

                    <!-- Clips Section -->
                    <div id="clips-section" class="hidden mb-8">
                        <h3 class="font-display font-semibold text-base text-slate-900 dark:text-white mb-4 flex items-center gap-2">
                            🎞️ Generated Clips (<span id="clips-count">0</span>)
                        </h3>
                        <div id="clips-grid" class="clip-grid"></div>
                    </div>

                    <!-- Activity Log -->
                    <div id="log-section" class="hidden">
                        <h3 class="font-semibold text-sm text-slate-900 dark:text-white mb-3 flex items-center gap-2">
                            <i data-lucide="scroll-text" class="w-4 h-4 text-brand-500"></i> Activity Log
                        </h3>
                        <div id="log-viewer" class="log-viewer"></div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="api.js"></script>
    <script>
        lucide.createIcons();

        const STEPS = [
            { key: 'download', label: 'Download' },
            { key: 'transcribe', label: 'Transcribe' },
            { key: 'analyze', label: 'AI Analysis' },
            { key: 'metadata', label: 'Metadata' },
            { key: 'render', label: 'Render' },
            { key: 'done', label: 'Done' },
        ];

        // Get job ID from URL params
        const urlParams = new URLSearchParams(window.location.search);
        const jobId = urlParams.get('id');

        let currentJob = null;
        let sseConnection = null;
        let pollInterval = null;
        let loadGeneration = 0;
        let clipsSignature = '';

        function stopJobUpdates() {
            if (sseConnection) { sseConnection.close(); sseConnection = null; }
            if (pollInterval) { clearInterval(pollInterval); pollInterval = null; }
        }

        function renderJob(job) {
            currentJob = job;
            const content = document.getElementById('page-content');
            const loading = document.getElementById('page-loading');

            loading.classList.add('hidden');
            document.getElementById('page-not-found').classList.add('hidden');
            content.classList.remove('hidden');

            // Header
            document.getElementById('job-id').textContent = `#${job.id}`;
            document.getElementById('job-source').textContent = job.url || job.upload_filename || 'Unknown source';
            document.title = `Job #${job.id} — OSC Studio`;

            // Badge
            const badge = document.getElementById('job-badge');
            const statusLabel = job.cancel_requested && !['completed', 'failed', 'cancelled'].includes(job.status)
                ? 'Cancellation requested' : STATUS_LABELS[job.status] || job.status;
            badge.className = `badge badge-${job.status}`;
            badge.textContent = statusLabel;

            const isTerminal = ['completed', 'failed', 'cancelled'].includes(job.status);
            const cancelBtn = document.getElementById('cancel-job-btn');
            cancelBtn.classList.toggle('hidden', isTerminal);
            cancelBtn.disabled = !!job.cancel_requested;
            cancelBtn.textContent = job.cancel_requested ? 'Stopping after current operation…' : 'Cancel Job';

            // Progress
            const progressSection = document.getElementById('progress-section');
            if (!isTerminal || job.status === 'cancelled') {
                progressSection.classList.remove('hidden');
                const percent = job.progress?.percent || 0;
                document.getElementById('progress-percent').textContent = `${Math.round(percent)}%`;
                document.getElementById('progress-bar').style.width = `${percent}%`;
                document.getElementById('progress-message').textContent = job.cancel_requested && !isTerminal
                    ? 'Cancellation requested. The current download, AI request, or render may finish before stopping.'
                    : job.progress?.message || '';

                const currentStep = job.progress?.step || '';
                document.getElementById('progress-steps').innerHTML = STEPS.map(s => {
                    const stepIdx = STEPS.findIndex(x => x.key === s.key);
                    const currentIdx = STEPS.findIndex(x => x.key === currentStep);
                    let cls = '';
                    if (stepIdx < currentIdx) cls = 'done';
                    else if (stepIdx === currentIdx) cls = 'active';
                    return `<div class="progress-step ${cls}"><span class="step-dot"></span>${s.label}</div>`;
                }).join('');
            } else {
                progressSection.classList.add('hidden');
            }

            // Error
            const errorSection = document.getElementById('error-section');
            if (job.error) {
                errorSection.classList.remove('hidden');
                document.getElementById('error-message').textContent = job.error;
            } else {
                errorSection.classList.add('hidden');
            }

            // Clips
            const clipsSection = document.getElementById('clips-section');
            if (job.clips && job.clips.length > 0) {
                clipsSection.classList.remove('hidden');
                document.getElementById('clips-count').textContent = job.clips.length;

                const baseUrl = StudioAPI.getBackendUrl();
                const signature = JSON.stringify([baseUrl, job.clips]);
                if (signature !== clipsSignature) {
                clipsSignature = signature;
                document.getElementById('clips-grid').innerHTML = job.clips.map((clip, i) => {
                    const downloadUrl = clip.download_url?.startsWith('/api/outputs/') ? escapeHtml(`${baseUrl}${clip.download_url}`) : '';
                    const title = escapeHtml(clip.title || clip.title_en || `Clip ${clip.rank || i + 1}`);
                    return `
                        <div class="clip-card">
                            ${downloadUrl ? `<video class="clip-video" controls preload="none" src="${downloadUrl}" onerror="this.nextElementSibling.classList.remove('hidden')"></video><p class="hidden p-3 text-xs text-amber-500">Preview unavailable. Use Open video below; if the tunnel shows a warning, continue there and retry playback.</p>` : ''}
                            <div class="p-4">
                                <div class="font-semibold text-sm text-slate-900 dark:text-white mb-2 line-clamp-2">${title}</div>
                                <div class="flex flex-wrap items-center gap-3 text-xs text-slate-500 dark:text-slate-400 mb-3">
                                    ${clip.viral_score ? `<span class="font-semibold text-amber-500">🔥 ${escapeHtml(clip.viral_score)}</span>` : ''}
                                    ${clip.duration ? `<span>${Math.round(clip.duration)}s</span>` : ''}
                                    ${clip.rank ? `<span>Rank #${escapeHtml(clip.rank)}</span>` : ''}
                                </div>
                                ${downloadUrl ? `
                                    <a href="${downloadUrl}" target="_blank" rel="noopener" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-medium border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">
                                        <i data-lucide="external-link" class="w-3.5 h-3.5"></i> Open video
                                    </a>
                                    <a href="${downloadUrl}" download target="_blank" rel="noopener" class="inline-flex items-center gap-1.5 px-3 py-1.5 text-xs font-medium text-brand-500">Download</a>
                                ` : ''}
                            </div>
                        </div>
                    `;
                }).join('');
                lucide.createIcons();
                }
            } else {
                clipsSection.classList.add('hidden');
            }

            // Log
            const logSection = document.getElementById('log-section');
            if (job.log && job.log.length > 0) {
                logSection.classList.remove('hidden');
                document.getElementById('log-viewer').innerHTML = job.log.map(line => `<div>${escapeHtml(line)}</div>`).join('');
            } else {
                logSection.classList.add('hidden');
            }

            // Stop polling if terminal
            if (isTerminal) {
                stopJobUpdates();
                // Ignore older polling responses still in flight after the final snapshot.
                loadGeneration++;
            }
        }

        async function cancelJob() {
            if (!currentJob || !confirm('Cancel this job after its current operation finishes?')) return;
            const btn = document.getElementById('cancel-job-btn');
            btn.disabled = true;
            try {
                await StudioAPI.deleteJob(jobId);
                renderJob(await StudioAPI.fetchJob(jobId));
            } catch (error) {
                btn.disabled = false;
                document.getElementById('error-section').classList.remove('hidden');
                document.getElementById('error-message').textContent = error.message;
            }
        }

        async function loadJob() {
            const generation = ++loadGeneration;
            stopJobUpdates();
            if (!jobId) {
                document.getElementById('page-loading').classList.add('hidden');
                document.getElementById('page-not-found').classList.remove('hidden');
                return;
            }

            if (!StudioAPI.isConfigured()) {
                document.getElementById('page-content').classList.add('hidden');
                document.getElementById('page-loading').classList.add('hidden');
                document.getElementById('page-not-found').classList.remove('hidden');
                document.querySelector('#page-not-found h3').textContent = 'Backend not connected';
                return;
            }

            try {
                const job = await StudioAPI.fetchJob(jobId);
                if (generation !== loadGeneration) return;
                renderJob(job);

                const isTerminal = ['completed', 'failed', 'cancelled'].includes(job.status);
                if (!isTerminal) {
                    const refresh = async () => {
                        try {
                            const data = await StudioAPI.fetchJob(jobId);
                            if (generation === loadGeneration) renderJob(data);
                        } catch (error) {
                            if (generation === loadGeneration) {
                                document.getElementById('progress-message').textContent = `Connection interrupted; retrying. ${error.message}`;
                            }
                        }
                    };
                    // SSE
                    sseConnection = StudioAPI.createSSE(jobId, (event) => {
                        if (generation !== loadGeneration) return;
                        if (['completed', 'failed', 'cancelled'].includes(event.type)
                            || ['completed', 'failed', 'cancelled'].includes(event.status)) {
                            // A terminal progress event from older servers may precede its clips.
                            // Only the canonical job response may stop polling and rendering.
                            refresh();
                        } else if (event.type === 'progress') {
                            if (currentJob) {
                                currentJob.status = event.status;
                                currentJob.progress = event.progress;
                                currentJob.error = event.error;
                                currentJob.cancel_requested = event.cancel_requested;
                                renderJob(currentJob);
                            }
                        }
                    });

                    // Fallback polling
                    pollInterval = setInterval(refresh, 3000);
                }
            } catch (err) {
                if (generation !== loadGeneration) return;
                document.getElementById('page-loading').classList.add('hidden');
                document.getElementById('page-not-found').classList.remove('hidden');
                document.querySelector('#page-not-found h3').textContent = err.message;
            }
        }

        loadJob();
        window.addEventListener('studio:connected', loadJob);
        window.addEventListener('studio:disconnected', loadJob);
        window.addEventListener('pagehide', stopJobUpdates);
    </script>
</body>

</html>
